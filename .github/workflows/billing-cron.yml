name: Billing Cron Jobs (retired)

# Billing jobs are owned by Scalingo Scheduler. The schedules and commands
# live in the repository's cron.json and run in the production API app.
# Keep this workflow as a manually-invokable marker so the old workflow is not
# silently mistaken for the production scheduler.
on:
  workflow_dispatch:

jobs:
  retired:
    name: Scalingo owns billing scheduling
    runs-on: ubuntu-latest
    steps:
      - name: Report scheduler ownership
        run: echo "Billing jobs run via Scalingo Scheduler from cron.json; no GitHub Actions job is required."
