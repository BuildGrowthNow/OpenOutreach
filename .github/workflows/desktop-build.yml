name: Build Desktop App

permissions:
  contents: read

on:
  push:
    paths:
      - 'openoutreach/desktop/**'
      - 'desktop/**'
      - 'requirements/base.txt'
    branches:
      - main
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish artifacts to the Lengrowth release repository and R2'
        required: true
        default: false
        type: boolean
      sign:
        description: 'Sign and notarize release artifacts (requires Apple/Windows signing credentials)'
        required: true
        default: false
        type: boolean

jobs:
  build-macos:
    name: Build macOS App
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r requirements/base.txt
          pip install -r desktop/requirements.txt
          pip install playwright playwright-stealth

      - name: Generate icons
        run: |
          cd openoutreach/desktop/assets
          python generate_icon.py

      - name: Build macOS app
        run: python desktop/build.py

      - name: Sign macOS app for approved publish
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish == true && inputs.sign == true }}
        env:
          APPLE_DEVELOPER_ID: ${{ secrets.APPLE_DEVELOPER_ID }}
        run: python desktop/build.py --no-build --sign

      - name: Create DMG
        run: |
          brew install create-dmg || true
          python desktop/build.py --no-build --dmg

      - name: Notarize macOS DMG for approved publish
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish == true && inputs.sign == true }}
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: python desktop/build.py --no-build --notarize

      - name: Get version
        id: version
        run: |
          VERSION=$(python -c "exec(open('openoutreach/desktop/__version__.py').read()); print(__version__)")
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Rename DMG for stable download URL
        run: mv desktop/dist/Lengrowth-${{ steps.version.outputs.version }}.dmg desktop/dist/Lengrowth-macOS.dmg

      - name: Upload macOS DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: Lengrowth-macOS-${{ steps.version.outputs.version }}
          path: desktop/dist/Lengrowth-macOS.dmg

  build-windows:
    name: Build Windows App
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r requirements/base.txt
          pip install -r desktop/requirements.txt
          pip install playwright playwright-stealth

      - name: Get version
        id: version
        shell: bash
        run: |
          VERSION=$(python -c "exec(open('openoutreach/desktop/__version__.py').read()); print(__version__)")
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Build Windows exe
        run: python desktop/build.py

      - name: Install NSIS and create installer
        run: |
          choco install nsis -y
          python desktop/build.py --no-build --installer

      - name: Create MSIX package
        run: python desktop/build.py --no-build --msix

      - name: Sign Windows release artifacts for approved publish
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish == true && inputs.sign == true }}
        env:
          WINDOWS_SIGNING_CERT_BASE64: ${{ secrets.WINDOWS_SIGNING_CERT_BASE64 }}
          WINDOWS_SIGNING_CERT_PASSWORD: ${{ secrets.WINDOWS_SIGNING_CERT_PASSWORD }}
        shell: pwsh
        run: |
          .\desktop\windows\sign_release.ps1 -FilePath `
            desktop\dist\Lengrowth.exe, `
            desktop\dist\Lengrowth-${{ steps.version.outputs.version }}-Setup.exe, `
            desktop\dist\Lengrowth-${{ steps.version.outputs.version }}.msix

      - name: Upload Windows exe artifact
        uses: actions/upload-artifact@v4
        with:
          name: Lengrowth-Windows-${{ steps.version.outputs.version }}
          path: desktop/dist/Lengrowth.exe

      - name: Rename installer for stable download URL
        shell: bash
        run: mv desktop/dist/Lengrowth-${{ steps.version.outputs.version }}-Setup.exe desktop/dist/Lengrowth-Windows-Setup.exe

      - name: Upload Windows installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: Lengrowth-Windows-Installer-${{ steps.version.outputs.version }}
          path: desktop/dist/Lengrowth-Windows-Setup.exe

      - name: Upload Windows MSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: Lengrowth-Windows-MSIX-${{ steps.version.outputs.version }}
          path: desktop/dist/Lengrowth-${{ steps.version.outputs.version }}.msix

  release:
    name: Publish to Lengrowth/outbound
    needs: [build-macos, build-windows]
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish == true }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get version
        id: version
        run: |
          VERSION=$(python3 -c "exec(open('openoutreach/desktop/__version__.py').read()); print(__version__)")
          # Append short SHA so every push to main produces a unique tag
          SHORT_SHA=$(git rev-parse --short HEAD)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=v${VERSION}-${SHORT_SHA}" >> $GITHUB_OUTPUT

      - name: Download macOS artifact
        uses: actions/download-artifact@v4
        with:
          name: Lengrowth-macOS-${{ steps.version.outputs.version }}
          path: ./release/macos

      - name: Download Windows exe artifact
        uses: actions/download-artifact@v4
        with:
          name: Lengrowth-Windows-${{ steps.version.outputs.version }}
          path: ./release/windows

      - name: Download Windows installer artifact
        uses: actions/download-artifact@v4
        with:
          name: Lengrowth-Windows-Installer-${{ steps.version.outputs.version }}
          path: ./release/windows

      - name: Download Windows MSIX artifact
        uses: actions/download-artifact@v4
        with:
          name: Lengrowth-Windows-MSIX-${{ steps.version.outputs.version }}
          path: ./release/windows

      - name: Inspect artifacts and generate release evidence
        run: |
          python scripts/inspect_release_artifact.py ./release/macos/Lengrowth-macOS.dmg
          python scripts/inspect_release_artifact.py ./release/windows/Lengrowth.exe
          test -f ./release/windows/Lengrowth-Windows-Setup.exe
          python scripts/inspect_release_artifact.py ./release/windows/Lengrowth-Windows-Setup.exe
          python scripts/inspect_release_artifact.py ./release/windows/Lengrowth-${{ steps.version.outputs.version }}.msix
          sha256sum ./release/macos/Lengrowth-macOS.dmg ./release/windows/Lengrowth.exe > ./release/SHA256SUMS.txt
          sha256sum ./release/windows/Lengrowth-Windows-Setup.exe >> ./release/SHA256SUMS.txt
          sha256sum ./release/windows/Lengrowth-${{ steps.version.outputs.version }}.msix >> ./release/SHA256SUMS.txt
          python scripts/generate_sbom.py --output ./release/SBOM.cyclonedx.json

      - name: Create release on Lengrowth/outbound
        uses: softprops/action-gh-release@v2
        with:
          repository: Lengrowth/outbound
          tag_name: ${{ steps.version.outputs.tag }}
          name: Lengrowth Desktop v${{ steps.version.outputs.version }}
          make_latest: true
          body: |
            ## Lengrowth Desktop v${{ steps.version.outputs.version }}

            ### Release status

            ${{ inputs.sign == true && 'This release is signed and notarized.' || 'This is an unsigned interim release. Windows SmartScreen and macOS Gatekeeper warnings are expected until platform signing credentials are configured.' }}

            ### Installation

            **macOS (10.15 Catalina or later):**
            1. Download `Lengrowth-macOS.dmg`
            2. Open the DMG and drag Lengrowth to Applications
            3. **First launch only:** Right-click Lengrowth in Applications → **"Open"** → **"Open"** again
            4. Log in with your Lengrowth account

            **Windows - Installer (recommended):**
            1. Download `Lengrowth-Windows-Setup.exe`
            2. Run the installer and follow the wizard
            3. If SmartScreen appears, click **"More info" → "Run anyway"**
            4. Log in with your Lengrowth account

            **Windows - Standalone (no install):**
            1. Download `Lengrowth.exe`
            2. Run directly from any folder
            3. If SmartScreen appears, click **"More info" → "Run anyway"**

            **Windows - MSIX (sideloading):**
            1. Download `Lengrowth-${{ steps.version.outputs.version }}.msix`
            2. Open it with Windows App Installer

            ### Why run locally?
            - Use your own residential IP
            - Your LinkedIn credentials never leave your machine
          files: |
            ./release/macos/Lengrowth-macOS.dmg
            ./release/windows/Lengrowth.exe
            ./release/windows/Lengrowth-Windows-Setup.exe
            ./release/windows/Lengrowth-${{ steps.version.outputs.version }}.msix
            ./release/SHA256SUMS.txt
            ./release/SBOM.cyclonedx.json
          token: ${{ secrets.OUTBOUND_RELEASE_TOKEN }}
          draft: false
          prerelease: false

      - name: Upload installer to R2 (stable download URL)
        if: hashFiles('./release/windows/Lengrowth-Windows-Setup.exe') != ''
        run: npx wrangler r2 object put lengrowth-downloads/Lengrowth-Windows-Setup.exe --file ./release/windows/Lengrowth-Windows-Setup.exe --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_R2_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Upload macOS DMG to R2 (stable download URL)
        if: hashFiles('./release/macos/Lengrowth-macOS.dmg') != ''
        run: npx wrangler r2 object put lengrowth-downloads/Lengrowth-macOS.dmg --file ./release/macos/Lengrowth-macOS.dmg --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_R2_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Purge CDN cache for download URL
        if: hashFiles('./release/windows/Lengrowth-Windows-Setup.exe') != ''
        run: |
          curl -s -X POST "https://api.cloudflare.com/client/v4/zones/${{ secrets.CLOUDFLARE_ZONE_ID }}/purge_cache" \
            -H "Authorization: Bearer ${{ secrets.CLOUDFLARE_R2_TOKEN }}" \
            -H "Content-Type: application/json" \
            --data '{"files":["https://dl.lengrowth.com/Lengrowth-Windows-Setup.exe","https://dl.lengrowth.com/Lengrowth-macOS.dmg"]}'
