name: Build Desktop App

on:
  push:
    paths:
      - 'openoutreach/desktop/**'
      - 'desktop/**'
    branches:
      - main
  workflow_dispatch:

jobs:
  build-macos:
    name: Build macOS App
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r requirements/base.txt
          pip install -r desktop/requirements.txt
          pip install playwright playwright-stealth

      - name: Generate icons
        run: |
          cd openoutreach/desktop/assets
          python generate_icon.py

      - name: Build macOS app
        run: python desktop/build.py

      - name: Create DMG
        run: |
          brew install create-dmg || true
          python desktop/build.py --no-build --dmg

      - name: Get version
        id: version
        run: |
          VERSION=$(python -c "exec(open('openoutreach/desktop/__version__.py').read()); print(__version__)")
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Rename DMG for release
        run: |
          mv desktop/dist/Lengrowth-*.dmg desktop/dist/Lengrowth-macOS.dmg 2>/dev/null || \
          mv desktop/dist/*.dmg desktop/dist/Lengrowth-macOS.dmg || true

      - name: Upload macOS DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: Lengrowth-macOS-${{ steps.version.outputs.version }}
          path: desktop/dist/Lengrowth-macOS.dmg

  build-windows:
    name: Build Windows App
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r requirements/base.txt
          pip install -r desktop/requirements.txt
          pip install playwright playwright-stealth

      - name: Build Windows exe
        run: python desktop/build.py

      - name: Install NSIS and create installer
        run: |
          choco install nsis -y
          python desktop/build.py --no-build --installer
        continue-on-error: true

      - name: Create MSIX package
        run: python desktop/build.py --no-build --msix
        continue-on-error: true

      - name: Get version
        id: version
        shell: bash
        run: |
          VERSION=$(python -c "exec(open('openoutreach/desktop/__version__.py').read()); print(__version__)")
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Rename installer for release
        shell: bash
        run: mv desktop/dist/*-Setup.exe desktop/dist/Lengrowth-Windows-Setup.exe 2>/dev/null || true

      - name: Upload Windows exe artifact
        uses: actions/upload-artifact@v4
        with:
          name: Lengrowth-Windows-${{ steps.version.outputs.version }}
          path: desktop/dist/Lengrowth.exe

      - name: Upload Windows installer artifact
        uses: actions/upload-artifact@v4
        if: hashFiles('desktop/dist/Lengrowth-Windows-Setup.exe') != ''
        with:
          name: Lengrowth-Windows-Installer-${{ steps.version.outputs.version }}
          path: desktop/dist/Lengrowth-Windows-Setup.exe

      - name: Upload Windows MSIX artifact
        uses: actions/upload-artifact@v4
        if: hashFiles('desktop/dist/*.msix') != ''
        with:
          name: Lengrowth-Windows-MSIX-${{ steps.version.outputs.version }}
          path: desktop/dist/*.msix

  release:
    name: Publish to Lengrowth/outbound
    needs: [build-macos, build-windows]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get version
        id: version
        run: |
          VERSION=$(python3 -c "exec(open('openoutreach/desktop/__version__.py').read()); print(__version__)")
          # Append short SHA so every push to main produces a unique tag
          SHORT_SHA=$(git rev-parse --short HEAD)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=v${VERSION}-${SHORT_SHA}" >> $GITHUB_OUTPUT

      - name: Download macOS artifact
        uses: actions/download-artifact@v4
        with:
          name: Lengrowth-macOS-${{ steps.version.outputs.version }}
          path: ./release/macos

      - name: Download Windows exe artifact
        uses: actions/download-artifact@v4
        with:
          name: Lengrowth-Windows-${{ steps.version.outputs.version }}
          path: ./release/windows

      - name: Download Windows installer artifact
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: Lengrowth-Windows-Installer-${{ steps.version.outputs.version }}
          path: ./release/windows

      - name: Download Windows MSIX artifact
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: Lengrowth-Windows-MSIX-${{ steps.version.outputs.version }}
          path: ./release/windows

      - name: Create release on Lengrowth/outbound
        uses: softprops/action-gh-release@v2
        with:
          repository: Lengrowth/outbound
          tag_name: ${{ steps.version.outputs.tag }}
          name: Lengrowth Desktop v${{ steps.version.outputs.version }}
          make_latest: true
          body: |
            ## Lengrowth Desktop v${{ steps.version.outputs.version }}

            ### Installation

            **macOS (10.15 Catalina or later):**
            1. Download `Lengrowth-macOS.dmg`
            2. Open the DMG and drag Lengrowth to Applications
            3. **First launch only:** Right-click Lengrowth in Applications → **"Open"** → **"Open"** again
            4. Log in with your Lengrowth account

            **Windows — Installer (recommended):**
            1. Download `Lengrowth-Windows-Setup.exe`
            2. Run the installer and follow the wizard
            3. If SmartScreen appears, click **"More info" → "Run anyway"**
            4. Log in with your Lengrowth account

            **Windows — Standalone (no install):**
            1. Download `Lengrowth.exe`
            2. Run directly from any folder
            3. If SmartScreen appears, click **"More info" → "Run anyway"**

            ### Why run locally?
            - Use your own residential IP — no proxy costs ($25–75/mo saved)
            - Your LinkedIn credentials never leave your machine
            - Runs silently in the system tray, auto-starts on login
          files: |
            ./release/macos/Lengrowth-macOS.dmg
            ./release/windows/Lengrowth.exe
            ./release/windows/Lengrowth-Windows-Setup.exe
            ./release/windows/*.msix
          token: ${{ secrets.OUTBOUND_RELEASE_TOKEN }}
          draft: false
          prerelease: false
