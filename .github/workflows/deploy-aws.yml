name: Deploy to AWS EC2

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to AWS EC2
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up SSH
        env:
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$EC2_SSH_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy via SSH
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
          DEBUG: ${{ secrets.DEBUG }}
          SSH_AUTH_SOCK: /dev/null
        run: |
          # Ensure lingering is enabled so rootless Docker survives SSH disconnect
          ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no -o IdentitiesOnly=yes "${EC2_USER}@${EC2_HOST}" "
            sudo loginctl enable-linger ${EC2_USER}
          "

          # Clone or update the repository on the server (force reset to avoid merge conflicts)
          ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no -o IdentitiesOnly=yes "${EC2_USER}@${EC2_HOST}" "
            set -e
            if [ -d ~/OpenOutreach/.git ]; then
              cd ~/OpenOutreach
              # Ensure deploy user owns workspace files before cleanup
              sudo chown -R "${EC2_USER}:${EC2_USER}" .
              # Remove unsynced files (Dockerfile, docker-compose.yml, .env) and reset to GitHub
              git clean -fd
              git reset --hard
              git pull origin main
            else
              git clone https://github.com/buildgrowthnow/openoutreach.git ~/OpenOutreach
            fi
            cd ~/OpenOutreach
          "

          # Deploy with docker-compose - build new image first, then recreate
          # (avoids a hard down→up gap that causes 502s for desktop daemons)
          ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no -o IdentitiesOnly=yes "${EC2_USER}@${EC2_HOST}" "
            set -e
            cd ~/OpenOutreach
            docker compose build
            docker compose up -d --force-recreate --remove-orphans
          "

      - name: Ensure MongoDB Indexes
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
        run: |
          echo "Creating MongoDB indexes..."
          ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no -o IdentitiesOnly=yes "${EC2_USER}@${EC2_HOST}" "
            set -e
            cd ~/OpenOutreach
            # Ensure MongoDB indexes are created (idempotent)
            docker compose exec -T openoutreach python -m openoutreach.cli ensure-indexes
          "

      - name: Wait for services to be healthy
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
        run: |
          echo "Waiting for container to report healthy..."
          ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no -o IdentitiesOnly=yes "${EC2_USER}@${EC2_HOST}" "
            set -e
            cd ~/OpenOutreach
            for i in \$(seq 1 24); do
              STATUS=\$(docker inspect --format='{{.State.Health.Status}}' \$(docker compose ps -q openoutreach) 2>/dev/null || echo 'unknown')
              echo \"Health status: \$STATUS (attempt \$i/24)\"
              if [ \"\$STATUS\" = 'healthy' ]; then
                echo 'Container is healthy!'
                exit 0
              fi
              sleep 10
            done
            echo 'WARNING: Container did not reach healthy state in time'
            exit 0
          "

      - name: Check Docker Compose Status
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
        run: |
          echo "Checking Docker Compose status..."
          ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no -o IdentitiesOnly=yes "${EC2_USER}@${EC2_HOST}" "
            set -e
            cd ~/OpenOutreach
            docker compose ps -a
          "

      - name: Check Docker Logs
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
        run: |
          echo "Checking Docker logs for services..."
          ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no -o IdentitiesOnly=yes "${EC2_USER}@${EC2_HOST}" "
            set -e
            cd ~/OpenOutreach
            docker compose logs --tail=50
          "

      - name: Cleanup SSH
        if: always()
        run: |
          rm -f ~/.ssh/id_rsa
          rm -f ~/.ssh/known_hosts