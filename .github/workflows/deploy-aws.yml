name: Deploy to AWS EC2

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      confirm_production_deploy:
        description: "Confirm this authorized production deployment"
        required: true
        default: false
        type: boolean

jobs:
  deploy:
    name: Deploy to AWS EC2
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.confirm_production_deploy == true }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: production
    env:
      DEPLOY_SHA: ${{ github.sha }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Resolve application version from source
        id: version
        run: |
          VERSION=$(python -c "import ast; tree=ast.parse(open('openoutreach/desktop/__version__.py', encoding='utf-8').read()); print(next(node.value.value for node in tree.body if isinstance(node, ast.Assign) and any(getattr(target, 'id', '') == '__version__' for target in node.targets)))")
          echo "app_version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Set up SSH
        env:
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          EC2_KNOWN_HOSTS: ${{ secrets.EC2_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          if [ -z "$EC2_KNOWN_HOSTS" ]; then
            echo 'EC2_KNOWN_HOSTS must be configured; refusing unverified SSH'
            exit 1
          fi
          mkdir -p ~/.ssh
          echo "$EC2_SSH_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          printf '%s\n' "$EC2_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Deploy via SSH
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          APP_VERSION: ${{ steps.version.outputs.app_version }}
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
          DEBUG: ${{ secrets.DEBUG }}
          SSH_AUTH_SOCK: /dev/null
        run: |
          # Ensure lingering is enabled so rootless Docker survives SSH disconnect
          ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=yes -o IdentitiesOnly=yes "${EC2_USER}@${EC2_HOST}" "
            sudo loginctl enable-linger ${EC2_USER}
          "

          # Clone or update the repository on the server (force reset to avoid merge conflicts)
          ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=yes -o IdentitiesOnly=yes "${EC2_USER}@${EC2_HOST}" "
            set -e
            if [ -d ~/OpenOutreach/.git ]; then
              cd ~/OpenOutreach
              # Ensure deploy user owns workspace files before cleanup
              sudo chown -R "${EC2_USER}:${EC2_USER}" .
              # Remove unsynced files (Dockerfile, docker-compose.yml, .env) and reset to the selected SHA
              git clean -fd
              git reset --hard
              git fetch origin '${DEPLOY_SHA}'
              git checkout --detach '${DEPLOY_SHA}'
            else
              git clone https://github.com/buildgrowthnow/openoutreach.git ~/OpenOutreach
              cd ~/OpenOutreach
              git checkout --detach '${DEPLOY_SHA}'
            fi
            cd ~/OpenOutreach
          "

          # Reclaim unused Docker layers before building. Do not prune volumes:
          # MongoDB and application data must survive deployments.
          ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=yes -o IdentitiesOnly=yes "${EC2_USER}@${EC2_HOST}" "
            set -e
            docker system prune --all --force
            df -h "

          # Ensure the canonical database name exists before Compose evaluates
          # its required-variable guard. This never overwrites a non-empty value.
          ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=yes -o IdentitiesOnly=yes "${EC2_USER}@${EC2_HOST}" "
            set -e
            cd ~/OpenOutreach
            if [ ! -f .env ]; then
              printf 'MONGODB_NAME=openoutreach\n' > .env
            elif ! grep -Eq '^MONGODB_NAME=[^[:space:]]+$' .env; then
              if grep -q '^MONGODB_NAME=' .env; then
                sed -i 's/^MONGODB_NAME=.*/MONGODB_NAME=openoutreach/' .env
              else
                printf '\nMONGODB_NAME=openoutreach\n' >> .env
              fi
            fi
          "

          # Deploy with docker-compose - build new image first, then recreate
          # (avoids a hard down→up gap that causes 502s for desktop daemons)
          ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=yes -o IdentitiesOnly=yes "${EC2_USER}@${EC2_HOST}" "
            set -e
            cd ~/OpenOutreach
            APP_VERSION='${APP_VERSION}' BUILD_COMMIT='${DEPLOY_SHA}' docker compose build
            APP_VERSION='${APP_VERSION}' BUILD_COMMIT='${DEPLOY_SHA}' docker compose up -d --force-recreate --remove-orphans
          "

      - name: Ensure MongoDB Indexes
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
        run: |
          echo "Creating MongoDB indexes..."
          ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=yes -o IdentitiesOnly=yes "${EC2_USER}@${EC2_HOST}" "
            set -e
            cd ~/OpenOutreach
            # Ensure MongoDB indexes are created (idempotent)
            docker compose exec -T openoutreach python -m openoutreach.cli ensure-indexes
          "

      - name: Wait for services to be healthy
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
        run: |
          echo "Waiting for container to report healthy..."
          ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=yes -o IdentitiesOnly=yes "${EC2_USER}@${EC2_HOST}" "
            set -e
            cd ~/OpenOutreach
            for i in \$(seq 1 24); do
              STATUS=\$(docker inspect --format='{{.State.Health.Status}}' \$(docker compose ps -q openoutreach) 2>/dev/null || echo 'unknown')
              echo \"Health status: \$STATUS (attempt \$i/24)\"
              if [ \"\$STATUS\" = 'healthy' ]; then
                echo 'Container is healthy!'
                exit 0
              fi
              sleep 10
            done
            echo 'ERROR: Container did not reach healthy state in time'
            docker compose ps -a
            exit 1
          "

      - name: Check Docker Compose Status
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
        run: |
          echo "Checking Docker Compose status..."
          ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=yes -o IdentitiesOnly=yes "${EC2_USER}@${EC2_HOST}" "
            set -e
            cd ~/OpenOutreach
            docker compose ps -a
          "

      - name: Check Docker Logs
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
        run: |
          echo "Checking Docker logs for services..."
          ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=yes -o IdentitiesOnly=yes "${EC2_USER}@${EC2_HOST}" "
            set -e
            cd ~/OpenOutreach
            docker compose logs --tail=50
          "

      - name: Verify deployed build identity
        env:
          EXPECTED_VERSION: ${{ steps.version.outputs.app_version }}
          EXPECTED_COMMIT: ${{ env.DEPLOY_SHA }}
        run: |
          set -euo pipefail
          headers=$(mktemp)
          trap 'rm -f "$headers"' EXIT
          body=$(curl --fail --silent --show-error --dump-header "$headers" --max-time 20 'https://outreach-api.lengrowth.com/api/health')
          if ! grep -Eiq '^cache-control:[[:space:]]*no-store' "$headers"; then
            echo 'Deployed health endpoint is missing Cache-Control: no-store'
            exit 1
          fi
          actual_version=$(printf '%s' "$body" | jq -r '.build.version // empty')
          actual_commit=$(printf '%s' "$body" | jq -r '.build.commit // empty')
          test "$actual_version" = "$EXPECTED_VERSION"
          test "$actual_commit" = "$EXPECTED_COMMIT"
          echo "Verified deployed build $actual_version ($actual_commit)"

      - name: Smoke test public daemon gateway
        run: |
          set -euo pipefail
          for attempt in $(seq 1 12); do
            bootstrap=$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' --max-time 20 'https://outreach-api.lengrowth.com/api/daemon/bootstrap?linkedin_profile_id=smoke' || true)
            compatibility=$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' --max-time 20 'https://outreach-api.lengrowth.com/api/daemon/v2/compatibility' || true)
            configuration=$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' --max-time 20 'https://outreach-api.lengrowth.com/api/daemon/config?linkedin_profile_id=smoke' || true)
            echo "Public daemon smoke attempt ${attempt}/12: bootstrap=${bootstrap} compatibility=${compatibility} configuration=${configuration}"
            if [ "$bootstrap" = '410' ] && [ "$compatibility" = '200' ] && [ "$configuration" != '522' ] && [ "$configuration" != '000' ]; then
              exit 0
            fi
            sleep 10
          done
          echo 'Public daemon gateway smoke test failed'
          exit 1

      - name: Cleanup SSH
        if: always()
        run: |
          rm -f ~/.ssh/id_rsa
          rm -f ~/.ssh/known_hosts
