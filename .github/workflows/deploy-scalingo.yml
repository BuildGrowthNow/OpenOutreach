name: Deploy to Scalingo

on:
  workflow_dispatch:
    inputs:
      rollback_sha:
        description: "Optional previously accepted commit SHA to deploy instead"
        required: false
        type: string

permissions:
  contents: read

env:
  SCALINGO_REGION: osc-fr1

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand(\"ping\").ok'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # Tests only need a deterministic non-production signing key for settings import.
      SECRET_KEY: ci-test-only-not-for-production
      MONGODB_ENABLED: "true"
      MONGODB_URI: mongodb://localhost:27017
      MONGODB_NAME: openoutreach_test
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements/local.txt
      - run: python -m compileall -q openoutreach
      - run: python -m pytest -q
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci --prefix frontend
      - run: npm run build --prefix frontend

  production:
    needs: test
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install Scalingo CLI
        run: |
          curl -fsSL https://cli-dl.scalingo.com/release/scalingo_latest_linux_amd64.tar.gz | tar -xz
          sudo install scalingo_*/scalingo /usr/local/bin/scalingo
      - name: Deploy approved SHA to production (daemon remains scaled separately)
        env:
          SCALINGO_API_TOKEN: ${{ secrets.SCALINGO_API_TOKEN }}
          DEPLOY_SHA: ${{ github.event.inputs.rollback_sha || github.sha }}
        run: |
          scalingo login --api-token "$SCALINGO_API_TOKEN"
          scalingo whoami
          # The API slug is Python-only. Keep the root Procfile, Python code,
          # requirements and .buildpacks while excluding Node manifests and the
          # separately deployed frontend so Scalingo selects the Python buildpack.
          mkdir -p /tmp/openoutreach-api-source
          git archive --format=tar "$DEPLOY_SHA" | tar -xf - -C /tmp/openoutreach-api-source
          rm -rf /tmp/openoutreach-api-source/frontend
          rm -f /tmp/openoutreach-api-source/package.json /tmp/openoutreach-api-source/package-lock.json
          tar -czf /tmp/openoutreach-api.tgz -C /tmp/openoutreach-api-source .
          scalingo --app outreach-api --region "$SCALINGO_REGION" deploy /tmp/openoutreach-api.tgz "$DEPLOY_SHA"
          # Preserve the frontend/ prefix because outreach-web uses PROJECT_DIR=frontend.
          # The explicit Node buildpack keeps archive deployments deterministic.
          git archive --format=tar.gz --output=/tmp/openoutreach-web.tgz "$DEPLOY_SHA" frontend
          scalingo --app outreach-web --region "$SCALINGO_REGION" deploy /tmp/openoutreach-web.tgz "$DEPLOY_SHA"
      - name: Validate production endpoints
        run: |
          curl --fail --silent --show-error --retry 10 --retry-connrefused --retry-delay 6 https://outreach-api.lengrowth.com/api/health >/dev/null
          curl --fail --silent --show-error --retry 10 --retry-connrefused --retry-delay 6 https://outreach.lengrowth.com/ >/dev/null

  rollback:
    if: ${{ inputs.rollback_sha != '' }}
    needs: production
    runs-on: ubuntu-latest
    environment: production
    steps:
      - run: echo "Rollback SHA was deployed through the same guarded archive path; verify acceptance before resuming traffic."
